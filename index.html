<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASA BANKO Journal</title><style>
:root{--g:#e0b33e;--bg:#070706}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#3b2014,#090908 38%);color:#f7f0df;font-family:Arial,sans-serif}.app{max-width:480px;margin:auto;padding-bottom:80px}.hero{height:180px;padding:24px 18px;display:flex;align-items:flex-end;background:linear-gradient(#0001,#000d),linear-gradient(135deg,#351542,#c04f35,#18130c);border-bottom:1px solid #735717}.brand{font:32px Impact;letter-spacing:2px;color:#f2cc60;text-shadow:3px 3px #62370c}.sub{font-weight:900;letter-spacing:4px}main{padding:16px}.card{background:#11110eee;border:1px solid #3b311b;border-radius:18px;padding:16px}.title{color:#f2cc60;font-weight:1000;font-size:19px}.label{margin:16px 0 8px;font-size:11px;font-weight:900;color:#c9bea4;letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.two{grid-template-columns:repeat(2,1fr)}.four{grid-template-columns:repeat(4,1fr)}button{background:#19170f;color:#eee3c7;border:1px solid #66501d;border-radius:10px;padding:11px 5px;font-weight:900}button.on{background:linear-gradient(#f3cc58,#bd8110);color:#171005;border-color:#ffe17b}.drop{display:none;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.drop.open{display:grid}.multiTop{width:100%;text-align:left}.upload{display:block;text-align:center;padding:18px;border:1px dashed #846a29;border-radius:12px;color:#e7bd4d;font-weight:900}input{display:none}textarea{width:100%;min-height:95px;background:#080806;color:white;border:1px solid #51421c;border-radius:12px;padding:12px}.save{width:100%;margin-top:16px;padding:16px;background:linear-gradient(90deg,#a96c08,#f1cd59,#a96c08);color:#140d03;border:0;font-size:15px}.status{text-align:center;color:#45d88a;font-size:12px;margin-top:10px;min-height:16px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#090908f5;border-top:1px solid #493817;padding:8px 2px}nav button{border:0;background:none;color:#8c8475;font-size:9px;padding:8px 1px}nav button:first-child{color:#f0c34d}</style></head><body><div class="app">
<header class="hero"><div><div class="brand">CASA BANKO</div><div class="sub">TRADE JOURNAL</div></div></header><main><section class="card"><div class="title">LOG TRADE · BUILD 1</div>
<div class="label">SESSION</div><div class="grid single" data-k="session"><button>ASIA</button><button>LONDON</button><button>NEW YORK</button></div>
<div class="label">MARKET PHASE</div><div class="grid two single" data-k="phase"><button>PULLBACK</button><button>CONTINUATION</button><button>CONSOLIDATION</button><button>EXPANSION</button></div>
<div class="label">KEY LEVEL TF · MULTI-SELECT</div><div class="multi" data-k="keyLevel"><button class="multiTop">Select timeframes ▾</button><div class="drop"><button>MONTHLY</button><button>WEEKLY</button><button>DAILY</button><button>4H</button><button>1H</button><button>30M</button><button>15M</button><button>5M</button><button>NONE</button></div></div>
<div class="label">BOS CONFIRMATION TF · MULTI-SELECT</div><div class="multi" data-k="bosTF"><button class="multiTop">Select timeframes ▾</button><div class="drop"><button>DAILY</button><button>4H</button><button>1H</button><button>30M</button><button>15M</button><button>5M</button><button>3M</button><button>1M</button><button>NONE</button></div></div>
<div class="label">ENTRY CONFIRMATION TF · MULTI-SELECT</div><div class="multi" data-k="entryTF"><button class="multiTop">Select timeframes ▾</button><div class="drop"><button>1H</button><button>30M</button><button>15M</button><button>5M</button><button>3M</button><button>1M</button><button>NONE</button></div></div>
<div class="label">LIQUIDITY SWEEP?</div><div class="grid two single" data-k="liq"><button>YES</button><button>NO</button></div>
<div class="label">ENTRY MODEL · MULTI-SELECT</div><div class="grid four many" data-k="model"><button>BOS</button><button>GAP</button><button>IFVG</button><button>SWEEP</button></div>
<div class="label">FOLLOWED TRADING PLAN?</div><div class="grid two single" data-k="plan"><button>YES</button><button>NO</button></div>
<div class="label">TRADE GRADE</div><div class="grid four single" data-k="grade"><button>A+</button><button>A</button><button>B</button><button>C</button></div>
<div class="label">SCREENSHOT</div><label class="upload" for="shot">＋ ADD SCREENSHOT</label><input id="shot" type="file" accept="image/*"><div id="fn" style="font-size:11px;color:#8f8777;margin-top:6px">No screenshot selected.</div>
<div class="label">TRADE NOTES</div><textarea id="notes" placeholder="What did you see? What went right or wrong?"></textarea>
<button class="save" id="save">SAVE TRADE</button><div class="status" id="status"></div></section></main>
<nav><button>✎<br>JOURNAL</button><button>▥<br>STATS</button><button>⌁<br>ANALYTICS</button><button>▦<br>CALENDAR</button><button>⚙<br>SETTINGS</button></nav></div>
<script>
const S={};document.querySelectorAll('.single').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');S[g.dataset.k]=b.textContent}));
document.querySelectorAll('.many').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{b.classList.toggle('on');S[g.dataset.k]=[...g.querySelectorAll('.on')].map(x=>x.textContent)}));
document.querySelectorAll('.multi').forEach(m=>{let t=m.querySelector('.multiTop'),d=m.querySelector('.drop');t.onclick=()=>d.classList.toggle('open');d.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.textContent==='NONE'){d.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}else{d.querySelectorAll('button').forEach(x=>{if(x.textContent==='NONE')x.classList.remove('on')});b.classList.toggle('on')}let v=[...d.querySelectorAll('.on')].map(x=>x.textContent);S[m.dataset.k]=v;t.textContent=(v.length?v.join(' • '):'Select timeframes')+' ▾'})});
shot.onchange=e=>fn.textContent=e.target.files[0]?.name||'No screenshot selected.';save.onclick=()=>{S.notes=notes.value;S.savedAt=new Date().toISOString();let a=JSON.parse(localStorage.getItem('casaBankoTrades')||'[]');a.push({...S});localStorage.setItem('casaBankoTrades',JSON.stringify(a));status.textContent='✓ Test trade saved on this device.'}
</script></body></html>
