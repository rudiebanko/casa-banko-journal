<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASA BANKO Analytics</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#3b2014,#090908 38%);color:#f7f0df;font-family:Arial,sans-serif}.app{max-width:480px;margin:auto;padding:22px 16px 40px}.brand{font:30px Impact;color:#f2cc60;letter-spacing:2px}.sub{font-weight:900;letter-spacing:3px;margin-bottom:18px}.card{background:#11110eee;border:1px solid #3b311b;border-radius:18px;padding:16px;margin-bottom:14px}.title{color:#f2cc60;font-weight:1000;font-size:18px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}button{background:#19170f;color:#eee3c7;border:1px solid #66501d;border-radius:10px;padding:10px 4px;font-weight:900;font-size:10px}button.on{background:linear-gradient(#f3cc58,#bd8110);color:#171005}.custom{display:none;margin-top:12px}.custom.open{display:block}.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}input{width:100%;background:#080806;color:white;border:1px solid #51421c;border-radius:10px;padding:11px}.apply{width:100%;margin-top:8px}.range{text-align:center;color:#9d9585;font-size:11px;margin-top:10px}.row{margin:16px 0}.rowTop{display:flex;justify-content:space-between;font-size:12px;font-weight:900}.meta{color:#9d9585;font-size:10px;margin-top:3px}.track{height:11px;background:#29251b;border-radius:20px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#9d6810,#f2cb55);border-radius:20px}.empty{color:#8d8576;font-size:12px;margin-top:14px}.back{display:block;text-align:center;text-decoration:none;color:#f2cc60;border:1px solid #66501d;border-radius:12px;padding:12px;font-weight:900}</style></head><body><div class="app"><div class="brand">CASA BANKO</div><div class="sub">TRADE ANALYTICS</div><section class="card"><div class="title">FILTER ANALYTICS</div><div class="filters" id="filters"><button class="on" data-f="all">ALL</button><button data-f="week">WEEK</button><button data-f="month">MONTH</button><button data-f="custom">CUSTOM</button></div><div class="custom" id="custom"><div class="dates"><input id="from" type="date"><input id="to" type="date"></div><button class="apply" id="apply">APPLY RANGE</button></div><div class="range" id="range">ALL TRADES</div></section><div id="charts"></div><a class="back" href="./">← BACK TO JOURNAL</a></div><script>
let filter='all',cf='',ct='';const $=x=>document.getElementById(x);function time(x){let d=new Date(x.date||x.savedAt);return isNaN(d)?null:d}function trades(){let a=JSON.parse(localStorage.getItem('casaBankoTrades')||'[]');if(filter==='all')return a;let n=new Date(),s,e=new Date(n);e.setHours(23,59,59,999);if(filter==='week'){s=new Date(n);s.setDate(s.getDate()-((s.getDay()+6)%7));s.setHours(0,0,0,0);range.textContent='THIS WEEK'}else if(filter==='month'){s=new Date(n.getFullYear(),n.getMonth(),1);range.textContent='THIS MONTH'}else{if(!cf||!ct)return[];s=new Date(cf+'T00:00:00');e=new Date(ct+'T23:59:59');range.textContent=cf+' → '+ct}return a.filter(x=>{let d=time(x);return d&&d>=s&&d<=e})}function values(v){return Array.isArray(v)?v:(v?[v]:[])}function breakdown(a,key,opts){let map={};opts.forEach(o=>map[o]={t:0,w:0,p:0});a.forEach(x=>values(x[key]).forEach(v=>{if(!map[v])map[v]={t:0,w:0,p:0};map[v].t++;if(x.result==='WIN')map[v].w++;map[v].p+=Number(x.pnl)||0}));return map}function card(title,map){let entries=Object.entries(map).filter(([k,v])=>v.t);let h='<section class="card"><div class="title">'+title+'</div>';if(!entries.length)return h+'<div class="empty">No trades logged for this breakdown yet.</div></section>';entries.forEach(([k,v])=>{let decided=v.t;let wr=decided?Math.round(v.w/decided*100):0;h+='<div class="row"><div class="rowTop"><span>'+k+'</span><span>'+wr+'% WIN</span></div><div class="meta">'+v.t+' trades · '+(v.p<0?'-$':'$')+Math.abs(v.p).toFixed(2)+' P&L</div><div class="track"><div class="fill" style="width:'+wr+'%"></div></div></div>'});return h+'</section>'}function render(){let a=trades();charts.innerHTML=card('ENTRY MODEL',breakdown(a,'model',['BOS','GAP','IFVG','SWEEP']))+card('SESSION',breakdown(a,'session',['ASIA','LONDON','NEW YORK']))+card('MARKET PHASE',breakdown(a,'phase',['PULLBACK','CONTINUATION','CONSOLIDATION','EXPANSION']))+card('KEY LEVEL TIMEFRAME',breakdown(a,'keyLevel',['MONTHLY','WEEKLY','DAILY','4H','1H','30M','15M','5M']))+card('BOS CONFIRMATION TF',breakdown(a,'bosTF',['DAILY','4H','1H','30M','15M','5M','3M','1M']))+card('ENTRY CONFIRMATION TF',breakdown(a,'entryTF',['1H','30M','15M','5M','3M','1M']))+card('LIQUIDITY SWEEP',breakdown(a,'liq',['YES','NO']))+card('DIRECTION',breakdown(a,'direction',['BUY','SELL']))+card('TRADE GRADE',breakdown(a,'grade',['A+','A','B','C']))}filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{filters.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;custom.classList.toggle('open',filter==='custom');if(filter==='all')range.textContent='ALL TRADES';if(filter!=='custom')render()});apply.onclick=()=>{cf=from.value;ct=to.value;render()};render();</script></body></html>
